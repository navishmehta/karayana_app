# Smart Kirana on the Hostinger VPS: website + /api + /media on kirana.thecodemate.com.
# Installed as /etc/nginx/sites-available/kirana.thecodemate.com (linked from sites-enabled).
# The HTTPS lines in the installed copy were added by:  certbot --nginx -d kirana.thecodemate.com --redirect
server {
    listen 80;
    listen [::]:80;
    server_name kirana.thecodemate.com;

    # Product photos are up to 5 MB (IMAGE_MAX_UPLOAD_BYTES); leave room for the form data.
    client_max_body_size 8m;

    # API → uvicorn (kirana-backend.service)
    location /api/ {
        proxy_pass http://127.0.0.1:8030;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Uploaded product / category images
    location /media/ {
        root /var/www/kirana;
        expires 7d;
        try_files $uri =404;
    }

    # Customer website (single-page app). Hashed build files never change, so cache them for a year.
    root /var/www/kirana/web/current;
    location ~ ^/(_expo|assets)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
}
